name: Scrape KBO schedules

on:
  # 워크플로 또는 스크래퍼 코드가 바뀌면 자동 실행 (data/ 변경은 무시 — 무한 루프 방지)
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'
  schedule:
    # 매일 00:17 KST (= 15:17 UTC, 전날) — 어제 경기 결과 반영.
    # 정각은 GitHub 예약 실행이 몰려 몇 시간씩 밀려서 분을 비껴 둔다.
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: '과거 시즌만 다시 받을 때 (예: 2021). 비워두면 올해 시즌만.'
        required: false
        default: ''
      month:
        description: '특정 월만 (예: 4). 비워두면 시즌 전체. 검증/디버깅용.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape-kbo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install deps
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Build CLI args
        id: args
        run: |
          year="${{ github.event.inputs.year }}"
          month="${{ github.event.inputs.month }}"
          # KST. A UTC year would be wrong for a few hours after New Year.
          current_year=$(TZ=Asia/Seoul date +'%Y')
          # Scheduled runs and pushes refresh the in-progress season only.
          # Past seasons stay as they are unless workflow_dispatch passes a year
          # (Naver is unreachable from GitHub runners, and re-scraping them is manual).
          if [ -n "$year" ]; then
            scope="--year $year --source kbo"
          elif [ ! -f "data/seasons/$current_year.json" ]; then
            # New year, schedule not published yet. Keep refreshing last
            # season too: its daily commit is the only repository activity
            # until then, and GitHub disables scheduled workflows in public
            # repositories after 60 days without any.
            scope="--years $((current_year - 1))-$current_year --source kbo"
          else
            scope="--year $current_year --source kbo"
          fi
          if [ -n "$month" ]; then
            scope="$scope --month $month"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Using: $scope"

      - name: Scrape
        working-directory: scraper
        env:
          KBO_DEBUG_DUMP: ${{ github.workspace }}/data/_debug_naver.json
        run: python scrape_kbo.py ${{ steps.args.outputs.scope }}

      - name: Validate scraped data
        if: github.event.inputs.month == ''
        run: python scraper/validate_kbo_data.py --data-dir data/seasons

      - name: Build human-readable summary
        if: github.event.inputs.month == ''
        run: python scraper/build_summary.py

      - name: Commit & push if data changed
        if: github.event.inputs.month == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons/ data/_summary.md
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh KBO schedule ($(date -u +'%Y-%m-%d'))"
            # After committing the intended season JSON and summary, discard
            # any diagnostics/temp files left by the scrape before rebasing.
            # Git refuses to rebase with a dirty worktree.
            echo "Cleaning worktree before rebase..."
            git status --short
            git reset --hard HEAD
            git clean -fd
            git status --short
            git fetch origin main
            git rebase -X theirs origin/main
            python scraper/validate_kbo_data.py --data-dir data/seasons
            git push origin HEAD:main
          fi
